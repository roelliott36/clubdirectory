
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Club Directory</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Campus Club Directory</h1>

<ul id="clubs"></ul>

<h2>Add a club</h2>

<form id="clubForm">

    <input type="text" id="name" placeholder="Club name" required maxlength="60">

    <input type="text" id="category" placeholder="Category" required maxlength="30">

    <input type="text" id="meetingDay" placeholder="Meeting day" required maxlength="20">

    <input type="text" id="room" placeholder="Room (optional)" maxlength="40">

    <button type="submit">Add club</button>

</form>

<p id="message"></p>

<script>

    async function loadClubs() {

        const clubs = await fetch("/api/clubs").then(r => r.json());

        const list = document.getElementById("clubs");

        list.innerHTML = "";

        for (const club of clubs) {

            const li = document.createElement("li");

            li.textContent = club.name + " – " + club.category + ", " + club.meetingDay
                + (club.room ? ", " + club.room : "");

            list.appendChild(li);

        }

    }

    document.getElementById("clubForm").addEventListener("submit", async event => {

        event.preventDefault();

        const club = {
            name: document.getElementById("name").value,
            category: document.getElementById("category").value,
            meetingDay: document.getElementById("meetingDay").value,
            room: document.getElementById("room").value
        };

        const response = await fetch("/api/clubs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(club)
        });

        if (response.ok) {

            event.target.reset();

            document.getElementById("message").textContent = "";

            loadClubs();

        } else {

            document.getElementById("message").textContent =
                "Please fill in name, category and meeting day.";

        }

    });

    loadClubs();

</script>

</body>
</html>
